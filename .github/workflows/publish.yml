name: Publish

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: Publish as a pre-release
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webview
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc ${{ inputs.pre_release && '--pre-release' || '' }}
